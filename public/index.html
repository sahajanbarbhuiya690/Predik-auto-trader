<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predik Auto Trader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1120;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #cbd5e1;
      margin-bottom: 7px;
      margin-top: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn {
      background: #2563eb;
      color: white;
    }

    .start-btn {
      background: #16a34a;
      color: white;
    }

    .stop-btn {
      background: #dc2626;
      color: white;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: #172033;
      color: #facc15;
      margin-top: 12px;
    }

    .price {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
    }

    .signal {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 15px;
      border-radius: 10px;
      background: #172033;
      margin-top: 10px;
    }

    .yes {
      color: #22c55e;
    }

    .no {
      color: #ef4444;
    }

    .log {
      background: #020617;
      border-radius: 8px;
      padding: 12px;
      height: 130px;
      overflow-y: auto;
      color: #94a3b8;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🤖 Predik Auto Trader</h1>
  <div class="subtitle">Automated Trading Dashboard</div>

  <!-- LOGIN -->
  <div class="card">
    <h2>🔐 Login</h2>

    <label>Mobile Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter mobile number"
    >

    <label>OTP</label>
    <input
      type="text"
      id="otp"
      placeholder="Enter OTP"
    >

    <button class="login-btn" onclick="login()">
      Login
    </button>

    <div class="status" id="loginStatus">
      Not logged in
    </div>
  </div>

  <!-- MARKET -->
  <div class="card">
    <h2>📊 Market</h2>

    <div class="price" id="price">
      ₹0.00
    </div>

    <div class="signal" id="signal">
      Waiting for market data...
    </div>

    <button onclick="checkMarket()">
      Refresh Market
    </button>
  </div>

  <!-- TRADING SETTINGS -->
  <div class="card">
    <h2>⚙️ Trading Settings</h2>

    <label>Trigger Price</label>
    <input
      type="number"
      id="triggerPrice"
      placeholder="75000"
    >

    <label>Condition</label>
    <select id="condition">
      <option value="above">Cross Above</option>
      <option value="below">Cross Below</option>
    </select>

    <label>Answer</label>
    <select id="answer">
      <option value="YES">YES</option>
      <option value="NO">NO</option>
    </select>

    <label>INR Amount</label>
    <input
      type="number"
      id="amount"
      value="100"
      min="1"
    >
  </div>

  <!-- BOT CONTROL -->
  <div class="card">
    <h2>🤖 Bot Control</h2>

    <div class="status" id="botStatus">
      Bot stopped
    </div>

    <button class="start-btn" onclick="startBot()">
      ▶ Start Bot
    </button>

    <button class="stop-btn" onclick="stopBot()">
      ■ Stop Bot
    </button>
  </div>

  <!-- LOG -->
  <div class="card">
    <h2>📋 Activity Log</h2>

    <div class="log" id="log">
      System ready...<br>
    </div>
  </div>

  <div class="footer">
    Predik Auto Trader<br>
    Test mode enabled
  </div>

</div>


<script>

  let botRunning = false;

  function addLog(message) {
    const log = document.getElementById("log");

    const time = new Date().toLocaleTimeString();

    log.innerHTML +=
      "[" + time + "] " + message + "<br>";

    log.scrollTop = log.scrollHeight;
  }


  function login() {

    const phone =
      document.getElementById("phone").value;

    const otp =
      document.getElementById("otp").value;

    if (!phone || !otp) {
      document.getElementById("loginStatus").innerText =
        "Please enter mobile number and OTP";

      return;
    }

    document.getElementById("loginStatus").innerText =
      "Logged in";

    addLog("User login successful");

  }


  function checkMarket() {

    /*
      Demo market value.

      Your server-side application can later
      replace this with real market data.
    */

    const price =
      (75000 + Math.random() * 1000).toFixed(2);

    document.getElementById("price").innerText =
      "₹" + price;

    const trigger =
      Number(
        document.getElementById("triggerPrice").value
      );

    if (!trigger) {

      document.getElementById("signal").innerText =
        "Set trigger price";

      return;
    }

    const condition =
      document.getElementById("condition").value;

    let signal = false;

    if (condition === "above" &&
        Number(price) >= trigger) {

      signal = true;

    }

    if (condition === "below" &&
        Number(price) <= trigger) {

      signal = true;

    }

    const signalBox =
      document.getElementById("signal");

    if (signal) {

      signalBox.innerHTML =
        '<span class="yes">TRIGGERED</span>';

      addLog(
        "Trigger condition reached at ₹" + price
      );

    } else {

      signalBox.innerHTML =
        '<span class="no">WAITING</span>';

    }

  }


  function startBot() {

    botRunning = true;

    document.getElementById("botStatus").innerText =
      "Bot running";

    addLog("Trading bot started");

  }


  function stopBot() {

    botRunning = false;

    document.getElementById("botStatus").innerText =
      "Bot stopped";

    addLog("Trading bot stopped");

  }


  /*
    Automatically refresh demo market data
    while the bot is running.
  */

  setInterval(function() {

    if (botRunning) {
      checkMarket();
    }

  }, 5000);

</script>

</body>
</html>
