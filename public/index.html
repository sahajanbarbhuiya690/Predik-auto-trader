<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predik Auto Trader</title>
<style>
body{font-family:system-ui;max-width:560px;margin:auto;padding:18px;background:#f5f5f5}
.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccc;font-size:16px}
button{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none}
.status{padding:10px;background:#eee;border-radius:10px}
.danger{background:#8b0000}
.small{font-size:12px;color:#666}
</style>
</head>

<body>

<h1>Predik Auto Trader</h1>

<div id="login" class="card">
<h2>Phone login</h2>

<input id="phone" placeholder="+919876543210">

<button onclick="send()">Send OTP</button>

<input id="otp" class="hidden" placeholder="OTP">

<button id="loginBtn" class="hidden" onclick="verify()">Login</button>

<p id="msg" class="small"></p>
</div>

<div id="dash" class="hidden">

<div class="card">
<h2>Trigger</h2>

<label>Predik market ID</label>
<input id="market">

<label>BTC trigger price</label>
<input id="trigger" type="number" step="0.01">

<div class="grid">

<div>
<label>Condition</label>
<select id="direction">
<option value="above">Cross Above</option>
<option value="below">Cross Below</option>
</select>
</div>

<div>
<label>Outcome</label>
<select id="outcome">
<option>YES</option>
<option>NO</option>
</select>
</div>

</div>

<label>Amount (₹)</label>
<input id="amount" type="number" min="1">

<button onclick="save(1)">START</button>

<button class="danger" onclick="stop()">STOP</button>

<div id="status" class="status">Loading…</div>

<p class="small">
The server has LIVE_TRADING disabled by default. Enable only after testing.
</p>

</div>

<div class="card">
<h3>Recent events</h3>
<pre id="events"></pre>
</div>

</div>

<script>

let tok='',phone='';

const $=id=>document.getElementById(id);

async function send(){
phone=$('phone').value;

let r=await fetch('/api/auth/send-otp',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({phone})
});

let j=await r.json();

$('otp').classList.remove('hidden');
$('loginBtn').classList.remove('hidden');

$('msg').textContent=
j.developmentOtp
?`Development OTP: ${j.developmentOtp}`
:'OTP sent';
}

async function verify(){

let r=await fetch('/api/auth/verify-otp',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
phone,
code:$('otp').value
})
});

let j=await r.json();

if(!r.ok)
return $('msg').textContent=j.error;

tok=j.token;

$('login').classList.add('hidden');
$('dash').classList.remove('hidden');

load();
}

async function load(){

let r=await fetch('/api/config',{
headers:{Authorization:'Bearer '+tok}
});

let j=await r.json();

for(let k of ['market','trigger','direction','outcome','amount'])
$(k).value=
j[k==='market'?'market_id':
k==='trigger'?'trigger':
k==='direction'?'direction':
k==='outcome'?'outcome':'amount_inr'];

$('status').textContent=
j.active?'🟢 ACTIVE':'⚪ STOPPED';

events();
}

async function save(active){

let body={
market_id:$('market').value,
trigger:+$('trigger').value,
direction:$('direction').value,
outcome:$('outcome').value,
amount_inr:+$('amount').value,
active
};

let r=await fetch('/api/config',{
method:'POST',
headers:{
'Content-Type':'application/json',
Authorization:'Bearer '+tok
},
body:JSON.stringify(body)
});

let j=await r.json();

$('status').textContent=
r.ok?'🟢 ACTIVE':'Error: '+j.error;

events();
}

async function stop(){

await fetch('/api/stop',{
method:'POST',
headers:{
Authorization:'Bearer '+tok
}
});

$('status').textContent='⚪ STOPPED';
}

async function events(){

let r=await fetch('/api/events',{
headers:{
Authorization:'Bearer '+tok
}
});

let j=await r.json();

$('events').textContent=
j.map(x=>
`${x.received_at} | ${x.status} | BTC ${x.price} | ${x.outcome} | ₹${x.amount_inr}
${x.detail}`
).join('\n\n');
}

</script>

</body>
</html>
